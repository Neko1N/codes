<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>創作者序號兌換</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6efe6;--bg-2:#efe4d4;--paper:#fffdf9;--ink:#3d352c;--ink-soft:#8a7d6c;
    --line:#e7dccb;--accent:#b5704e;--accent-soft:#e8cdbb;--accent-ink:#8a4f31;--gold:#c3a05a;
    --done-bg:#eef3e8;--done-line:#cfe0bd;--done-ink:#5a7a3e;--danger:#b2524a;
    --shadow:0 1px 2px rgba(80,60,40,.05),0 10px 30px rgba(110,84,55,.09);
    --shadow-sm:0 1px 2px rgba(80,60,40,.06),0 4px 12px rgba(110,84,55,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:"Noto Sans TC",system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(1200px 600px at 15% -10%, #fbf4ea 0%, rgba(251,244,234,0) 60%),radial-gradient(1000px 500px at 95% 0%, #f3e7d6 0%, rgba(243,231,214,0) 55%),linear-gradient(180deg,var(--bg) 0%,var(--bg-2) 100%);
    background-attachment:fixed;line-height:1.6;-webkit-font-smoothing:antialiased;padding:28px 18px 110px;}
  .wrap{max-width:1080px;margin:0 auto}

  header{text-align:center;padding:14px 0 26px}
  .kicker{font-size:12px;letter-spacing:.32em;color:var(--accent-ink);text-transform:uppercase;font-weight:700;opacity:.8}
  h1{font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(26px,4.2vw,40px);letter-spacing:.02em;margin:8px 0 6px;color:var(--ink)}
  .sub{color:var(--ink-soft);font-size:14.5px}
  .divider{width:54px;height:3px;border-radius:3px;margin:16px auto 0;background:linear-gradient(90deg,var(--gold),var(--accent))}

  .panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:20px 22px;margin-bottom:18px}
  .panel-title{font-family:"Noto Serif TC",serif;font-size:16px;font-weight:600;display:flex;align-items:center;gap:9px;margin-bottom:14px;color:var(--ink)}
  .panel-title .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}

  .accts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .acct{display:inline-flex;align-items:center;gap:9px;padding:9px 15px;border-radius:999px;cursor:pointer;background:#fbf5ec;border:1.5px solid var(--line);font-weight:500;font-size:14.5px;color:var(--ink);transition:.18s;user-select:none}
  .acct:hover{border-color:var(--accent-soft);transform:translateY(-1px)}
  .acct.active{background:linear-gradient(180deg,#fff,#fdf3e9);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px rgba(181,112,78,.18)}
  .acct .badge{font-size:11.5px;font-weight:700;color:#fff;background:var(--accent);border-radius:999px;padding:1px 8px;min-width:20px;text-align:center}
  .acct.active .badge{background:var(--accent-ink)}
  .acct .ava{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--gold),var(--accent))}
  .btn-ghost{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:999px;cursor:pointer;background:transparent;border:1.5px dashed var(--accent-soft);color:var(--accent-ink);font-weight:600;font-size:14px;font-family:inherit;transition:.18s}
  .btn-ghost:hover{background:#fbf1e7;border-style:solid}

  .summary{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
  .summary .who{display:flex;align-items:center;gap:12px;min-width:200px}
  .summary .who .ava{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--gold),var(--accent));box-shadow:0 4px 12px rgba(181,112,78,.25)}
  .summary .who .nm{font-family:"Noto Serif TC",serif;font-weight:600;font-size:18px}
  .summary .who .st{font-size:12.5px;color:var(--ink-soft)}
  .progress{flex:1;min-width:220px}
  .progress .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
  .progress .label{font-size:13px;color:var(--ink-soft)}
  .progress .count{font-family:"Noto Serif TC",serif;font-weight:700;font-size:15px;color:var(--accent-ink)}
  .bar{height:11px;border-radius:999px;background:#efe3d2;overflow:hidden;box-shadow:inset 0 1px 2px rgba(120,90,60,.12)}
  .bar>i{display:block;height:100%;width:0;border-radius:999px;transition:width .5s cubic-bezier(.22,1,.36,1);background:linear-gradient(90deg,var(--gold),var(--accent))}
  .acct-tools{display:flex;gap:8px}
  .icon-btn{width:38px;height:38px;border-radius:12px;cursor:pointer;border:1.5px solid var(--line);background:#fbf5ec;color:var(--ink-soft);font-size:16px;transition:.18s;display:grid;place-items:center}
  .icon-btn:hover{border-color:var(--accent-soft);color:var(--accent-ink);background:#fff}

  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .panel-head .panel-title{margin-bottom:0}
  .wavetabs{display:inline-flex;background:#faf3ea;border:1.5px solid var(--line);border-radius:12px;padding:4px;gap:4px}
  .wavetab{border:none;background:transparent;padding:7px 15px;border-radius:9px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--ink-soft);transition:.15s;display:flex;align-items:center;gap:7px}
  .wavetab:hover{color:var(--accent-ink)}
  .wavetab.on{background:#fff;color:var(--accent-ink);box-shadow:var(--shadow-sm)}
  .wavetab .wc{font-family:"Noto Sans TC";font-size:11px;font-weight:700;color:#fff;background:#cdbfa9;border-radius:999px;padding:1px 7px;min-width:16px;text-align:center}
  .wavetab.on .wc{background:var(--accent)}
  .toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .search{position:relative;flex:1;min-width:200px}
  .search input{width:100%;padding:12px 16px 12px 40px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);font-family:inherit;font-size:14.5px;color:var(--ink);box-shadow:var(--shadow-sm)}
  .search input:focus{outline:none;border-color:var(--accent)}
  .search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.45}
  .segmented{display:inline-flex;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:4px;box-shadow:var(--shadow-sm)}
  .segmented button{border:none;background:transparent;padding:8px 15px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--ink-soft);transition:.15s}
  .segmented button.on{background:linear-gradient(180deg,#fff,#fdf3e9);color:var(--accent-ink);box-shadow:var(--shadow-sm)}
  .btn-line{display:inline-flex;align-items:center;gap:7px;padding:11px 16px;border-radius:14px;cursor:pointer;border:1.5px solid var(--line);background:var(--paper);font-family:inherit;font-weight:700;font-size:14px;color:var(--accent-ink);box-shadow:var(--shadow-sm);transition:.18s}
  .btn-line:hover{transform:translateY(-1px);border-color:var(--accent-soft)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;box-shadow:var(--shadow-sm);transition:.2s;position:relative;overflow:hidden}
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
  .card.done{background:var(--done-bg);border-color:var(--done-line)}
  .card.picked{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
  .card .corner{position:absolute;top:0;right:0;width:0;height:0;border-style:solid;border-width:0 42px 42px 0;border-color:transparent var(--done-line) transparent transparent;opacity:0;transition:.2s}
  .card.done .corner{opacity:1}
  .card .corner-check{position:absolute;top:5px;right:7px;color:#fff;font-size:12px;opacity:0;transition:.2s}
  .card.done .corner-check{opacity:1}
  .card-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .pick{width:24px;height:24px;flex-shrink:0;border-radius:8px;border:2px solid var(--line);background:#fff;cursor:pointer;display:grid;place-items:center;transition:.15s;color:transparent}
  .pick:hover{border-color:var(--accent-soft)}
  .pick.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .pick:disabled{opacity:.35;cursor:not-allowed}
  .card-head .name{font-family:"Noto Serif TC",serif;font-weight:600;font-size:17px;line-height:1.25;min-width:0}

  .code{display:flex;align-items:center;gap:8px;width:100%;margin-bottom:14px;font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace;font-size:15px;letter-spacing:.06em;font-weight:600;color:var(--accent-ink);background:#fbf3e9;border:1px dashed var(--accent-soft);border-radius:10px;padding:10px 13px;cursor:pointer;transition:.15s;text-align:left}
  .code:hover{background:#f7ead9;border-color:var(--accent)}
  .code:active{transform:scale(.99)}
  .code .txt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .code .ci{opacity:.5;flex-shrink:0;transition:.15s}
  .code:hover .ci{opacity:.9}
  .card.done .code{background:#f1f6ea;border-color:var(--done-line);color:var(--done-ink)}
  .code.empty{cursor:default;color:var(--ink-soft);letter-spacing:0;font-family:"Noto Sans TC";border-style:solid;border-color:var(--line);background:#f7f1e8}
  .code.empty:hover{background:#f7f1e8;border-color:var(--line)}
  .code.sel{border-style:solid;border-color:var(--accent);background:#f4e2d2;color:var(--accent-ink)}
  .code.sel .ci{opacity:1}

  .toggle{width:100%;padding:10px;border-radius:11px;cursor:pointer;border:1.5px solid var(--line);background:#fff;font-family:inherit;font-weight:700;font-size:14px;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:7px;transition:.18s}
  .toggle:hover{border-color:var(--accent-soft)}
  .toggle.on{background:linear-gradient(180deg,#f3f8ec,#e8f1dc);border-color:var(--done-line);color:var(--done-ink)}
  .toggle:disabled{opacity:.45;cursor:not-allowed}

  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft)}
  .empty-state .big{font-size:40px;margin-bottom:10px;opacity:.5}
  .foot-note{width:100%;text-align:center;color:var(--ink-soft);font-size:12.5px;margin-top:22px;line-height:1.9}
  .notice{grid-column:1/-1;background:#fbf1e6;border:1px solid var(--accent-soft);color:var(--accent-ink);border-radius:14px;padding:12px 16px;font-size:13.5px;text-align:center}
  .flink{color:var(--accent-ink);cursor:pointer;text-decoration:underline;font-weight:600;white-space:nowrap}
  .flink:hover{color:var(--accent)}


  .overlay{position:fixed;inset:0;background:rgba(61,53,44,.4);backdrop-filter:blur(3px);display:none;place-items:center;z-index:60;padding:20px}
  .overlay.show{display:grid}
  .modal{background:var(--paper);border-radius:22px;box-shadow:0 30px 80px rgba(60,40,20,.3);width:100%;max-width:460px;padding:26px;animation:pop .25s cubic-bezier(.22,1,.36,1)}
  @keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:none}}
  .modal h3{font-family:"Noto Serif TC",serif;font-size:20px;margin-bottom:4px}
  .modal p.hint{color:var(--ink-soft);font-size:13px;margin-bottom:18px}
  .mg-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink)}
  .field input{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);font-family:inherit;font-size:15px;color:var(--ink);background:#fffdfa}
  .field input:focus{outline:none;border-color:var(--accent)}
  .allbox{width:100%;height:300px;resize:vertical;padding:14px 16px;border-radius:14px;border:1.5px solid var(--accent-soft);background:#fbf3e9;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15.5px;letter-spacing:.06em;color:var(--accent-ink);line-height:2;white-space:pre}
  .allbox:focus{outline:none;border-color:var(--accent)}
  .btn-solid{display:inline-flex;align-items:center;gap:7px;padding:11px 18px;border-radius:14px;cursor:pointer;border:none;font-family:inherit;font-weight:700;font-size:14px;color:#fff;background:linear-gradient(180deg,#c17c57,var(--accent));box-shadow:0 6px 16px rgba(181,112,78,.28);transition:.18s}
  .btn-solid:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(181,112,78,.34)}
  .modal.wide{max-width:600px}
  .mg-list{max-height:48vh;overflow-y:auto;margin:0 -4px;padding:2px 4px}
  .mg-row{display:flex;gap:8px;align-items:center;margin-bottom:9px}
  .mg-row .idx{width:24px;text-align:right;color:var(--ink-soft);font-size:12.5px;flex-shrink:0;font-variant-numeric:tabular-nums}
  .mg-row input{padding:9px 11px;border-radius:10px;border:1.5px solid var(--line);font-family:inherit;font-size:14px;color:var(--ink);background:#fffdfa;min-width:0}
  .mg-row input:focus{outline:none;border-color:var(--accent)}
  .mg-row .mg-name{flex:1.3}
  .mg-row .mg-code{flex:1;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em}
  .mg-row .mg-rm{width:34px;height:34px;flex-shrink:0;border-radius:9px;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);cursor:pointer;display:grid;place-items:center;transition:.15s}
  .mg-row .mg-rm:hover{color:var(--danger);border-color:#eccfca;background:#fcf4f2}
  .mg-add{width:100%;margin-top:4px;padding:11px;border-radius:12px;border:1.5px dashed var(--accent-soft);background:transparent;color:var(--accent-ink);font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;transition:.15s}
  .mg-add:hover{background:#fbf1e7;border-style:solid}
  .mg-tip{font-size:12px;color:var(--ink-soft);line-height:1.6;margin:10px 2px 0}
  .modal-actions{display:flex;gap:10px;margin-top:22px}
  .modal-actions button{flex:1;padding:12px;border-radius:12px;cursor:pointer;font-family:inherit;font-weight:700;font-size:14.5px;border:none;transition:.15s}
  .btn-cancel{background:#f1e8da;color:var(--ink-soft)}
  .btn-cancel:hover{background:#e9ddca}
  .btn-ok{background:linear-gradient(180deg,#c17c57,var(--accent));color:#fff}
  .btn-ok:hover{filter:brightness(1.04)}

  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;font-size:14px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.3s;z-index:70;white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:560px){body{padding:20px 12px 110px}.panel{padding:18px 16px}.summary{gap:16px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker">Serial Code</div>
    <h1>創作者序號兌換</h1>
    <p class="sub">管理多個帳號,個別記錄每組序號是否已兌換</p>
    <div class="divider"></div>
  </header>

  <div class="panel">
    <div class="panel-head">
      <div class="panel-title"><span class="dot"></span>我的帳號</div>
      <div id="waveBar"></div>
    </div>
    <div class="accts" id="accts"></div>
    <div class="summary" id="summary" style="display:none">
      <div class="who">
        <div class="ava" id="sumAva">?</div>
        <div><div class="nm" id="sumName">—</div><div class="st">目前檢視中的帳號</div></div>
      </div>
      <div class="progress">
        <div class="top"><span class="label">兌換進度</span><span class="count" id="sumCount">0 / 0</span></div>
        <div class="bar"><i id="sumBar"></i></div>
      </div>
      <div class="acct-tools">
        <button class="icon-btn" id="renameBtn" title="重新命名帳號">✎</button>
        <button class="icon-btn" id="delAcctBtn" title="刪除帳號">🗑</button>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <div class="search">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>
      <input id="search" placeholder="搜尋創作者或序號…">
    </div>
    <div class="segmented" id="filters">
      <button data-f="all" class="on">全部</button>
      <button data-f="todo">未兌換</button>
      <button data-f="done">已兌換</button>
    </div>
    <button class="btn-line" id="allBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      全部序號
    </button>
  </div>

  <div class="grid" id="grid"></div>

  <div class="foot-note">換裝置資料會消失唷 🥲 &nbsp;·&nbsp; <span class="flink" id="exportBtn">匯出備份</span> &nbsp;·&nbsp; <span class="flink" id="importBtn">還原備份</span></div>
  <input type="file" id="importFile" accept="application/json" hidden>
</div>


<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
	(function(){
	"use strict";
	const LS_KEY = "serialTracker.v1";

	// ===== 序號清單=====

	const WAVES = [
	{ id:"w1", name:"第一波", codes:[
	"Rui=RUIART","里歐=Leocyg","皮皮=17baby","小亮=XLIANG","獅子丸=SHISHI","小夜夜=yeyart",
	"艾希=ELSMAP","瓜肉=GUAROU","小君=XJUN24","初吻=ARKISS","基德薯叔=unkidd","肯倫=kinlun",
	"八毛=bamao8","光光實驗室=GUALAB","小六=MABUS6","阿嚕嚕=ARURU8","菇喜=GOODC8","魚丸=Yuwan8",
	"小貓奈奈=NEKONA","二犬=Twodog","金金=Jinjin","鈴姆=Lingmu","傑克雪諾=JKSNOW","卡祖笛=TKAZOO",
	"咪咪蛋=mmdart","taxicute=taxi88","可比_=kebi88","路過大學生=Passby","馬克巴巴=MKBABA",
	"薯餅姐姐=HBROWN","阿偉-Wei=awei24","短腿娜娜=nana24","ivanl艾文=ivan24",
	"愛文=PLYWEN","兔森森=BUNSEN"
	]},
	{ id:"w2", name:"第二波", codes:[
	"Rui=RUI8NZDGKJ","里歐=LEON4JBFNR","皮皮=PIPRPWM6R6","小亮=LIAF8U3EK5","獅子丸=SHIEK8GWMD","小夜夜=",
	"艾希=AIXK42K5B5","瓜肉=GUA77HKFQB","小君=JUN3NV8J6Q","初吻=KISF2J65JF","基德薯叔=KIDG99GK3C","肯倫=KENVXHGAF9",
	"八毛=MAOS6RHYAZ","光光實驗室=LAB9GWJW22","小六=LIU5E3RT4S","阿嚕嚕=ARUYY82VKQ","菇喜=GDC4REBMBH","魚丸=",
	"小貓奈奈=NEKUX232JY","二犬=DOGAG9VZK6","金金=JINEPHW4YB","鈴姆=LNGBS9PARP","傑克雪諾=SNWPV5APFM","卡祖笛=KAZPV7CZJQ",
	"咪咪蛋=MIMQHZKP38","taxicute=TAXV4UFN7Y","可比_=","路過大學生=PAS2EAYNAW","馬克巴巴=",
	"薯餅姐姐=HBRE8YNZY3","阿偉-Wei=WEIMHVV7RF","短腿娜娜=NANH2AQZ25","ivanl艾文=IVNNS5YYP7",
	"愛文=","兔森森=BUN6DSZ9ZA"
	]}
	];

	function parseRaw(raw){
	return String(raw||"").split(/\r?\n/).map(s=>s.trim())
	.filter(s=>s && !s.startsWith("//"))
      .map(s=>{const i=s.indexOf("=");return i<0?{name:s,code:""}:{name:s.slice(0,i).trim(),code:s.slice(i+1).trim()};})
      .filter(c=>c.name);
  }
  function waveById(id){return WAVES.find(w=>w.id===id)||WAVES[0];}
  function creatorsOf(id){return parseRaw(waveById(id).codes.join("\n")).map(c=>({id:c.name,name:c.name,code:c.code}));}

  let copiedId=null;  // 目前複製(高亮)的那一條
  let filter = "all", query = "";
  let state = load();


  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

  // 舊版資料(creators 帶隨機 id、redeemed 以 id 為鍵)→ 轉成以名字為鍵
  function migrate(o){
    if(Array.isArray(o.creators) && o.creators.length && o.creators[0] && o.creators[0].id){
      const id2name={};o.creators.forEach(c=>{if(c&&c.id)id2name[c.id]=c.name;});
      const r=o.redeemed||{};
      Object.keys(r).forEach(acct=>{
        const m=r[acct]||{},nm={};
        Object.keys(m).forEach(k=>{if(m[k]){const name=id2name[k]||k;nm[name]=true;}});
        r[acct]=nm;
      });
    }
    delete o.creators;
  }
  // 舊版單波紀錄 redeemed[帳號][名字]=true → 歸入「第一波」
  function migrateWaves(redeemed){
    if(!redeemed||typeof redeemed!=="object")return;
    Object.keys(redeemed).forEach(acct=>{
      const m=redeemed[acct];if(!m||typeof m!=="object")return;
      const hasWave=WAVES.some(w=>w.id in m);
      const flat=Object.values(m).some(v=>typeof v==="boolean");
      if(flat && !hasWave) redeemed[acct]={w1:Object.assign({},m)};
    });
  }

  function load(){
    const s={accounts:[],activeId:null,activeWave:"w1",redeemed:{}};
    try{
      const raw=localStorage.getItem(LS_KEY);
      if(raw){
        const o=JSON.parse(raw)||{};
        migrate(o);
        s.accounts=Array.isArray(o.accounts)?o.accounts:[];
        s.activeId=o.activeId||null;
        s.redeemed=o.redeemed&&typeof o.redeemed==="object"?o.redeemed:{};
        if(o.activeWave&&WAVES.some(w=>w.id===o.activeWave))s.activeWave=o.activeWave;
        migrateWaves(s.redeemed);
      }
    }catch(e){}
    s.creators=creatorsOf(s.activeWave);
    if(!s.accounts.find(a=>a.id===s.activeId)) s.activeId=s.accounts[0]?.id||null;
    return s;
  }
  function save(){
    try{localStorage.setItem(LS_KEY,JSON.stringify({accounts:state.accounts,activeId:state.activeId,activeWave:state.activeWave,redeemed:state.redeemed}));}
    catch(e){toast("儲存失敗,瀏覽器空間可能已滿");}
  }

  function initials(name){if(!name)return"?";const n=name.trim();return /[一-鿿]/.test(n)?n.slice(-1):n.slice(0,2).toUpperCase();}
  function activeAccount(){return state.accounts.find(a=>a.id===state.activeId)||null;}
  function redeemedMap(){
    if(!state.activeId)return{};
    const acct=state.redeemed[state.activeId]=state.redeemed[state.activeId]||{};
    acct[state.activeWave]=acct[state.activeWave]||{};
    return acct[state.activeWave];
  }
  function doneCount(acctId,waveId){
    const acct=state.redeemed[acctId]||{};const m=acct[waveId]||{};
    return creatorsOf(waveId).filter(c=>m[c.id]).length;
  }
  function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

  function render(){renderWaves();renderAccounts();renderSummary();renderGrid();save();}

  function renderWaves(){
    const bar=document.getElementById("waveBar");if(!bar)return;bar.innerHTML="";
    const tabs=document.createElement("div");tabs.className="wavetabs";
    const acc=activeAccount();
    WAVES.forEach(w=>{
      const b=document.createElement("button");
      b.className="wavetab"+(w.id===state.activeWave?" on":"");
      b.innerHTML=`${esc(w.name)}${acc?`<span class="wc">${doneCount(acc.id,w.id)}</span>`:""}`;
      b.onclick=()=>{if(state.activeWave!==w.id){state.activeWave=w.id;state.creators=creatorsOf(w.id);copiedId=null;render();}};
      tabs.appendChild(b);
    });
    bar.appendChild(tabs);
  }

  function renderAccounts(){
    const el=document.getElementById("accts");el.innerHTML="";
    state.accounts.forEach(a=>{
      const pill=document.createElement("div");
      pill.className="acct"+(a.id===state.activeId?" active":"");
      pill.innerHTML=`<span class="ava">${esc(initials(a.name))}</span>${esc(a.name)} <span class="badge">${doneCount(a.id,state.activeWave)}</span>`;
      pill.onclick=()=>{state.activeId=a.id;render();};
      el.appendChild(pill);
    });
    const add=document.createElement("button");
    add.className="btn-ghost";
    add.innerHTML=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg> 新增帳號`;
    add.onclick=openAddAccount;el.appendChild(add);
  }
  function renderSummary(){
    const box=document.getElementById("summary");const acc=activeAccount();
    if(!acc){box.style.display="none";return;}
    box.style.display="flex";
    document.getElementById("sumAva").textContent=initials(acc.name);
    document.getElementById("sumName").textContent=acc.name;
    const total=state.creators.length,done=doneCount(acc.id,state.activeWave);
    document.getElementById("sumCount").textContent=`${done} / ${total}`;
    document.getElementById("sumBar").style.width=(total?Math.round(done/total*100):0)+"%";
  }
  function renderGrid(){
    const grid=document.getElementById("grid");grid.innerHTML="";const acc=activeAccount();
    const map=acc?redeemedMap():{};const q=query.trim().toLowerCase();
    const list=state.creators.filter(c=>{
      const isDone=!!map[c.id];const hasCode=!!(c.code&&c.code.trim());
      if(filter==="done"&&!isDone)return false;
      if(filter==="todo"&&(isDone||!hasCode))return false;  // 未兌換:隱藏尚未公佈的
      if(q&&!(c.name.toLowerCase().includes(q)||(c.code||"").toLowerCase().includes(q)))return false;
      return true;
    });
    if(!acc){
      const nb=document.createElement("div");nb.className="notice";
      nb.innerHTML=`先在上方<b>新增帳號</b>,就能勾選記錄這個帳號兌換了哪些序號。`;
      grid.appendChild(nb);
    }
    if(list.length===0){const e=document.createElement("div");e.className="empty-state";e.style.gridColumn="1/-1";e.innerHTML=`<div class="big">🔍</div><div>沒有符合條件的序號。</div>`;grid.appendChild(e);return;}
    list.forEach(c=>{
      const hasCode=!!(c.code&&c.code.trim());const isDone=!!acc&&!!map[c.id];const isPicked=(c.id===copiedId);
      const canMark=!!acc&&hasCode;
      const card=document.createElement("div");
      card.className="card"+(isDone?" done":"")+(isPicked?" picked":"");
      card.innerHTML=`
        <div class="corner"></div><div class="corner-check">✓</div>
        <div class="card-head">
          <div class="name">${esc(c.name)}</div>
        </div>
        <button class="code ${hasCode?"":"empty"}${isPicked?" sel":""}" title="${hasCode?"點擊複製並選取":""}">
          <span class="txt">${hasCode?esc(c.code):"序號尚未公佈"}</span>
          ${hasCode?`<svg class="ci" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${isPicked?`<path d="M20 6 9 17l-5-5"/>`:`<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>`}</svg>`:""}
        </button>
        <button class="toggle ${isDone?"on":""}" ${canMark?"":"disabled"}>
          ${isDone?`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg> 已兌換`:(!acc?"新增帳號後可勾選":(hasCode?"標記為已兌換":"等待序號公佈"))}
        </button>`;
      const codeBtn=card.querySelector(".code");
      if(hasCode) codeBtn.onclick=()=>{copy(c.code,"已複製序號:"+c.code);copiedId=c.id;render();};
      const tg=card.querySelector(".toggle");
      if(canMark) tg.onclick=()=>{if(map[c.id])delete map[c.id];else map[c.id]=true;render();};
      grid.appendChild(card);
    });
  }

  function copy(text,msg){
    const done=()=>toast(msg||"已複製");
    if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
    else fallbackCopy(text,done);
  }
  function fallbackCopy(text,cb){
    const ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
    document.body.appendChild(ta);ta.select();
    try{document.execCommand("copy");cb();}catch(e){toast("複製失敗");}
    document.body.removeChild(ta);
  }

  let toastTimer;
  function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2000);}

  const overlay=document.getElementById("overlay"),modal=document.getElementById("modal");
  function closeModal(){overlay.classList.remove("show");modal.className="modal";modal.innerHTML="";}
  /* 點彈窗外的區域不會關閉,避免選字時誤觸 */
  document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

  function openAddAccount(){
    modal.innerHTML=`<h3>新增帳號</h3><p class="hint">幫這個遊戲帳號取個名字,方便辨識。</p>
      <div class="field"><label>帳號名稱</label><input id="mInput" placeholder="例如:主帳、小帳1、實況帳…" maxlength="24"></div>
      <div class="modal-actions"><button class="btn-cancel" id="mCancel">取消</button><button class="btn-ok" id="mOk">新增</button></div>`;
    overlay.classList.add("show");const inp=document.getElementById("mInput");inp.focus();
    document.getElementById("mCancel").onclick=closeModal;
    const ok=()=>{const v=inp.value.trim();if(!v){inp.focus();return;}const a={id:uid(),name:v};state.accounts.push(a);state.activeId=a.id;state.redeemed[a.id]={};closeModal();render();toast("已新增帳號:"+v);};
    document.getElementById("mOk").onclick=ok;inp.onkeydown=e=>{if(e.key==="Enter")ok();};
  }
  function openRenameAccount(){
    const acc=activeAccount();if(!acc)return;
    modal.innerHTML=`<h3>重新命名帳號</h3><p class="hint">修改目前帳號的顯示名稱。</p>
      <div class="field"><label>帳號名稱</label><input id="mInput" maxlength="24"></div>
      <div class="modal-actions"><button class="btn-cancel" id="mCancel">取消</button><button class="btn-ok" id="mOk">儲存</button></div>`;
    overlay.classList.add("show");const inp=document.getElementById("mInput");inp.value=acc.name;inp.focus();inp.select();
    document.getElementById("mCancel").onclick=closeModal;
    const ok=()=>{const v=inp.value.trim();if(!v){inp.focus();return;}acc.name=v;closeModal();render();toast("已更新名稱");};
    document.getElementById("mOk").onclick=ok;inp.onkeydown=e=>{if(e.key==="Enter")ok();};
  }
  function openDeleteAccount(){
    const acc=activeAccount();if(!acc)return;
    modal.innerHTML=`<h3>刪除帳號</h3><p class="hint">確定要刪除「${esc(acc.name)}」嗎?這個帳號的兌換紀錄會一併移除,無法復原。</p>
      <div class="modal-actions"><button class="btn-cancel" id="mCancel">取消</button><button class="btn-ok" id="mDel" style="background:linear-gradient(180deg,#c06258,var(--danger))">刪除</button></div>`;
    overlay.classList.add("show");
    document.getElementById("mCancel").onclick=closeModal;
    document.getElementById("mDel").onclick=()=>{delete state.redeemed[acc.id];state.accounts=state.accounts.filter(a=>a.id!==acc.id);state.activeId=state.accounts.length?state.accounts[0].id:null;closeModal();render();toast("已刪除帳號");};
  }

  function exportData(){
    const data={accounts:state.accounts,activeId:state.activeId,activeWave:state.activeWave,redeemed:state.redeemed};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");
    const d=new Date();const stamp=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;
    a.href=url;a.download=`序號兌換備份_${stamp}.json`;a.click();URL.revokeObjectURL(url);toast("已匯出備份檔");
  }
  function importData(file){
    const r=new FileReader();
    r.onload=()=>{try{
      const o=JSON.parse(r.result)||{};
      migrate(o);
      state.accounts=Array.isArray(o.accounts)?o.accounts:[];
      state.redeemed=o.redeemed&&typeof o.redeemed==="object"?o.redeemed:{};
      migrateWaves(state.redeemed);
      if(o.activeWave&&WAVES.some(w=>w.id===o.activeWave))state.activeWave=o.activeWave;
      state.creators=creatorsOf(state.activeWave);
      state.activeId=state.accounts.find(a=>a.id===o.activeId)?o.activeId:(state.accounts[0]?.id||null);
      copiedId=null;render();toast("已還原備份");
    }catch(e){toast("還原失敗:檔案格式不正確");}};
    r.readAsText(file);
  }

  function openAllCodes(){
    const codes=state.creators.filter(c=>c.code&&c.code.trim()).map(c=>c.code.trim());
    const text=codes.join("\n");
    modal.innerHTML=`
      <div class="mg-head"><h3>全部序號</h3><span class="hint" style="margin:0">共 ${codes.length} 組</span></div>
      <p class="hint" style="margin-top:-6px">一行一組,只有序號。可直接全選複製,或按下方按鈕一次複製全部。</p>
      <textarea class="allbox" id="allBox" readonly>${esc(text)}</textarea>
      <div class="modal-actions"><button class="btn-cancel" id="mCancel">關閉</button><button class="btn-ok" id="mOk">複製全部</button></div>`;
    overlay.classList.add("show");
    const box=document.getElementById("allBox");setTimeout(()=>{box.focus();box.select();},30);
    document.getElementById("mCancel").onclick=closeModal;
    document.getElementById("mOk").onclick=()=>{if(!codes.length){toast("目前沒有可複製的序號");return;}copy(text,`已複製全部 ${codes.length} 組序號`);};
  }

  document.getElementById("renameBtn").onclick=openRenameAccount;
  document.getElementById("delAcctBtn").onclick=openDeleteAccount;
  document.getElementById("allBtn").onclick=openAllCodes;
  document.getElementById("exportBtn").onclick=exportData;
  document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
  document.getElementById("importFile").onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value="";};
  document.getElementById("search").oninput=e=>{query=e.target.value;renderGrid();};
  document.getElementById("filters").onclick=e=>{const b=e.target.closest("button");if(!b)return;filter=b.dataset.f;[...document.querySelectorAll("#filters button")].forEach(x=>x.classList.toggle("on",x===b));renderGrid();};

  render();
})();
</script>
</body>
</html>
